services:
  db:
    image: postgres:16-alpine
    container_name: recoveryos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos_dev
      POSTGRES_DB: recoveryos
    ports:
      - "5432:5432"
    volumes:
      - recoveryos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveryos -d recoveryos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: recoveryos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://recoveryos:recoveryos_dev@db:5432/recoveryos?schema=public
      PORT: 4000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DEMO_MODE_ENABLED: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: recoveryos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  recoveryos_pgdata:
