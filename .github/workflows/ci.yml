name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://recoveryos:recoveryos_dev@localhost:5432/recoveryos?schema=public
      PORT: 4777
      HOST: 127.0.0.1
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL
        run: |
          docker run -d --name recoveryos-db \
            -e POSTGRES_USER=recoveryos \
            -e POSTGRES_PASSWORD=recoveryos_dev \
            -e POSTGRES_DB=recoveryos \
            -p 5432:5432 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec recoveryos-db pg_isready -U recoveryos && break || sleep 1
          done

      - run: npm ci

      - name: Create test database schema
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Lint
        run: npm run lint -w @recoveryos/api

      - name: Typecheck
        run: npm run typecheck -w @recoveryos/api

      - name: Test
        run: npm run test -w @recoveryos/api

      - name: Build
        run: npm run build -w @recoveryos/api

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w @recoveryos/web

      - name: Typecheck
        run: npm run typecheck -w @recoveryos/web

      - name: Test
        run: npm run test -w @recoveryos/web

      - name: Build
        run: npm run build -w @recoveryos/web
